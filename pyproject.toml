[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trenchscan"
version = "0.1.0"
description = "Phone video to 3D, tested on a radiator: structure-from-motion and a line-feature trial"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E701", "E702", "E731", "B905"]   # notebook-style one-liners; zip() over plot axes is meant to stop early

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
