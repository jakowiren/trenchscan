[project]
name = "trenchscan"
version = "0.1.0"
description = "Phone video -> 3D -> measured components: a weekend prototype"
requires-python = ">=3.10"
dependencies = ["pycolmap>=3.11", "opencv-python", "numpy", "plotly", "pyyaml", "open3d"]

[project.optional-dependencies]
dev = ["jupyterlab", "ipykernel", "nbstripout"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
